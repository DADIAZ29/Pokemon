{% extends "base.html "%}

{% block title %} 
    {{ pokemon.name }}
{% endblock %}


{% block content %} 


<div class="container-fluid text-center bg-dark text-light p-4 rounded shadow">
   <h1>{{ pokemon.name }}</h1> 
    <div class="row justify-content-evenly">
        <div class="col-6">
            <div id="pokemonCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner border border-warning rounded">
                    <div class="carousel-item active">
                        <img src="{{pokemon.sprites.front_default}}" class="d-block w-100" alt="{{ pokemon.name }}" />
                    </div>
                    <div class="carousel-item">
                        <img src="{{pokemon.sprites.back_default}}" class="d-block w-100" alt="{{ pokemon.name }}" />
                    </div>
                    <div class="carousel-item">
                        <img src="{{pokemon.sprites.front_shiny}}" class="d-block w-100" alt="{{ pokemon.name }}" />
                    </div>
                    <div class="carousel-item">
                        <img src="{{pokemon.sprites.back_shiny}}" class="d-block w-100" alt="{{ pokemon.name }}" />
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#pokemonCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon bg-warning rounded-circle" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#pokemonCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon bg-warning rounded-circle" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </div>
        <div class="col-4 d-flex flex-column justify-content-center">
            <h3 class="text-info">Altura: {{ pokemon.height }}</h3>
            <h3 class="text-info">Peso: {{ pokemon.weight }}</h3>
            <div class="d-grid gap-2 mt-3">
               
                <a class="btn btn-outline-light" href="{% url 'pokemon_list' %}">Volver a la Lista</a>
            </div>
        </div>
    </div>
</div>


{% endblock %}
